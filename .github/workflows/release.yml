name: Release

# Every commit is checked by the pre-commit hook (.githooks/pre-commit) and by ci.yml on push;
# this workflow makes a release. Pushing a version tag (v0.1.0, matching the workspace version in
# Cargo.toml) runs the gate on the tagged commit (save the oracle suites, which run locally),
# packages the three crates, builds the command-line tool for Linux, macOS and Windows, and publishes a
# GitHub Release with every file and its SHA-256 checksum. A manual run does the same without
# creating a release, and leaves the files as workflow artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# The Rust version is pinned, so that a new stable release, whose Clippy may add a lint, cannot turn
# the workflows red on its own; raise it deliberately, after running the gate locally on the new
# version. Cargo 1.90 or later is needed to package the three crates together (release.yml).

jobs:
  gate:
    name: Gate without DGGAL, and packages
    # Releases are made from the public repository alone; the private one never runs this.
    if: github.repository == 'terraops-org/rs4dggs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag names the workspace version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "the tag $GITHUB_REF_NAME does not name the workspace version $version" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - name: Rust 1.85, the declared minimum, which the gate checks
        run: rustup toolchain install 1.85 --profile minimal
      - name: scripts/check.sh --without-dggal
        # PyPI's DGGAL wheel is another build than the one the compiled operation orders were read
        # from, so the oracle suites run locally, in the pre-commit hook, and not here.
        run: ./scripts/check.sh --without-dggal
      - name: The three crates packaged
        # Packaged together, so that the encodings and the tool are verified against the library,
        # and the tool against the encodings, packaged beside them before any is on crates.io.
        run: cargo package -p rs4dggs -p rs4dggs-ogc -p rs4dggs-cli --locked
      - uses: actions/upload-artifact@v4
        with:
          name: crates
          path: target/package/*.crate
          if-no-files-found: error

  binaries:
    name: rs4dggs for ${{ matrix.target }}
    needs: gate
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: ${{ matrix.target }}
      - name: Build
        # The tool depends on the library and the encodings alone, so DGGAL is not needed here.
        run: cargo build --release --locked -p rs4dggs-cli --target ${{ matrix.target }}
      - name: Archive
        shell: bash
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml)
          name="rs4dggs-$version-${{ matrix.target }}"
          mkdir "$name"
          cp crates/rs4dggs-cli/README.md LICENSE crates/rs4dggs-cli/NOTICE "$name/"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "target/${{ matrix.target }}/release/rs4dggs.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
          else
            cp "target/${{ matrix.target }}/release/rs4dggs" "$name/"
            tar -czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            rs4dggs-*.tar.gz
            rs4dggs-*.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [gate, binaries]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "rs4dggs $GITHUB_REF_NAME" \
            --generate-notes
