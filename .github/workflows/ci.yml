name: CI

# The full gate, DGGAL's oracle suites included, on every push to main and every pull request.
# The public repository runs on GitHub's free standard runners; the pre-commit hook
# (.githooks/pre-commit) runs the same gate before each commit, and the release workflow runs it
# again on the tagged commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate
    # The public repository alone: a private copy of these files is billed, and has its own
    # local gate.
    if: github.repository == 'terraops-org/rs4dggs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust 1.85, the declared minimum, which the gate checks
        run: rustup toolchain install 1.85 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: DGGAL 0.0.6, the oracle the suites compare against
        run: |
          pip install dggal==0.0.6
          echo "DGGAL_SITE_PACKAGES=$(python -c 'import site; print(site.getsitepackages()[0])')" >> "$GITHUB_ENV"
      - name: The gate
        run: ./scripts/check.sh
