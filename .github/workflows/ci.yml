name: CI

# The gate, save DGGAL's oracle suites, on every push to main and every pull request, on GitHub's
# free standard runners. The pre-commit hook (.githooks/pre-commit) runs the full gate, oracle
# included, before each commit, and the release workflow runs this form again on the tagged commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate without DGGAL
    # The public repository alone: a private copy of these files is billed, and has its own
    # local gate.
    if: github.repository == 'terraops-org/rs4dggs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust 1.85, the declared minimum, which the gate checks
        run: rustup toolchain install 1.85 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: scripts/check.sh --without-dggal
        # PyPI's DGGAL wheel is another build than the one the compiled operation orders were read
        # from, so the oracle suites run locally, in the pre-commit hook, and not here.
        run: ./scripts/check.sh --without-dggal
